<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TuringLens Dashboard</title>

<style>
:root{
    --bg:#0f1115;
    --panel:rgba(255,255,255,.05);
    --line:#2c3340;
    --text:#f5f7fa;
    --muted:#98a2b3;
    --accent:#59f2d0;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:
    radial-gradient(circle at top,
    #1b2330 0%,
    #0f1115 55%);
    color:var(--text);
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    sans-serif;
    overflow:hidden;
}

.wrapper{
    padding:42px 54px;
    height:100vh;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:28px;
}

.title{
    font-size:48px;
    font-weight:700;
    letter-spacing:-1px;
}

.subtitle{
    margin-top:8px;
    color:var(--muted);
    font-size:18px;
}

.leader{
    background:rgba(89,242,208,.12);
    border:1px solid rgba(89,242,208,.2);
    color:var(--accent);
    padding:18px 24px;
    border-radius:24px;
    font-size:24px;
    backdrop-filter: blur(20px);
}

.board{
    background:var(--panel);
    border:1px solid rgba(255,255,255,.08);
    border-radius:34px;
    padding:34px;
    backdrop-filter: blur(18px);
    box-shadow:
        0 25px 70px rgba(0,0,0,.35);
}

.team{
    margin:28px 0;
}

.row{
    display:grid;
    grid-template-columns:
    90px 1fr 150px;
    gap:24px;
    align-items:center;
}

.name{
    font-size:28px;
    font-weight:700;
}

.track{
    position:relative;
    height:16px;
    background:linear-gradient(
        90deg,
        #262c38,
        #323947
    );
    border-radius:999px;
}

.checkpoint{
    position:absolute;
    top:-8px;
    width:2px;
    height:32px;
    background:rgba(255,255,255,.08);
}

.dot{
    position:absolute;
    top:-8px;
    width:32px;
    height:32px;
    border-radius:50%;
    transition:all .4s cubic-bezier(.2,.8,.2,1);
    box-shadow:
      0 0 30px rgba(89,242,208,.45);
}

.a{ background:#5BA8FF; }
.b{ background:#FF7B7B; }
.c{ background:#59F2D0; }
.d{ background:#FFD36B; }
.e{ background:#D18CFF; }

.module{
    text-align:right;
    font-size:22px;
    color:#d3d8df;
}

.labels{
    display:flex;
    justify-content:space-between;
    margin-left:116px;
    margin-right:150px;
    margin-top:18px;
    color:#78818d;
    font-size:14px;
}

.controls{
    margin-top:28px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:16px;
}

.card{
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    padding:18px;
}

.card-title{
    font-size:22px;
    font-weight:700;
    margin-bottom:12px;
}

button{
    width:100%;
    border:none;
    border-radius:14px;
    padding:14px;
    margin-top:8px;
    cursor:pointer;
    font-size:17px;
    font-weight:600;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}

.plus{
    background:
    linear-gradient(
      180deg,
      #73ffe5,
      #59f2d0
    );
    color:#111;
}

.minus{
    background:#2a313d;
    color:white;
}

.footer-tip{
    text-align:center;
    color:#7f8895;
    margin-top:18px;
    font-size:15px;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="header">

<div>
<div class="title">
实时挑战进度
</div>

<div class="subtitle">
TuringLens Study · Live Competition Dashboard
</div>
</div>

<div class="leader" id="leader">
🔥 当前领先：暂无
</div>

</div>

<div class="board">

<div id="teams"></div>

<div class="labels">
<div>Start</div>
<div>M1</div>
<div>M2</div>
<div>M3</div>
<div>M4</div>
<div>🏁 Finish</div>
</div>

</div>

<div class="controls" id="controls"></div>

<div class="footer-tip">
快捷键：
A / B / C / D / E = +1
Shift + A/B/C/D/E = −1
</div>

</div>

<script>
// --- 音效系统 ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

/**
 * 播放一个合成音效
 * @param {string} type - 'plus' (增加进度) 或 'win' (完成全部)
 */
function playStepSound(type) {
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === 'plus') {
        // 短促清脆的“叮”声
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(880, now); // 高音 A5
        oscillator.frequency.exponentialRampToValueAtTime(440, now + 0.1); 
        gainNode.gain.setValueAtTime(0.3, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        oscillator.start(now);
        oscillator.stop(now + 0.2);
    } else if (type === 'win') {
        // 胜利的连音
        oscillator.type = 'triangle';
        oscillator.frequency.setValueAtTime(523.25, now); // C5
        oscillator.frequency.setValueAtTime(659.25, now + 0.1); // E5
        oscillator.frequency.setValueAtTime(783.99, now + 0.2); // G5
        oscillator.frequency.setValueAtTime(1046.5, now + 0.3); // C6
        gainNode.gain.setValueAtTime(0.3, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        oscillator.start(now);
        oscillator.stop(now + 0.5);
    } else if (type === 'minus') {
        // 低沉的回退声
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(220, now); 
        oscillator.frequency.exponentialRampToValueAtTime(110, now + 0.1);
        gainNode.gain.setValueAtTime(0.2, now);
        gainNode.gain.linearRampToValueAtTime(0, now + 0.1);
        oscillator.start(now);
        oscillator.stop(now + 0.1);
    }
}

// --- 逻辑代码 ---

const order = ["A组","B组","C组","D组","E组"];
const progress = {"A组":0,"B组":0,"C组":0,"D组":0,"E组":0};
const colorClass = {"A组":"a","B组":"b","C组":"c","D组":"d","E组":"e"};

const teamsDiv = document.getElementById("teams");
const controlsDiv = document.getElementById("controls");

function getLeader(){
    const max = Math.max(...Object.values(progress));
    if(max===0) return "暂无";
    const leaders = Object.entries(progress).filter(([k,v])=>v===max).map(([k])=>k);
    return leaders.join("、");
}

function render(){
    teamsDiv.innerHTML="";
    controlsDiv.innerHTML="";
    document.getElementById("leader").innerText = `🔥 当前领先：${getLeader()}`;

    order.forEach(team=>{
        const p = progress[team];
        const percent = (p/4)*100;
        const row = document.createElement("div");
        row.className="team";
        row.innerHTML=`
        <div class="row">
            <div class="name">${team}</div>
            <div class="track">
                <div class="checkpoint" style="left:25%"></div>
                <div class="checkpoint" style="left:50%"></div>
                <div class="checkpoint" style="left:75%"></div>
                <div class="checkpoint" style="left:100%"></div>
                <div class="dot ${colorClass[team]}" style="left:calc(${percent}% - 16px)"></div>
            </div>
            <div class="module">${p===4 ? "已完成 ✅" : "Module " + (p+1)}</div>
        </div>
        `;
        teamsDiv.appendChild(row);

        const card = document.createElement("div");
        card.className="card";
        card.innerHTML=`
        <div class="card-title">${team}</div>
        <button class="plus">+ 完成一个模块</button>
        <button class="minus">− 回退</button>
        `;

        card.querySelector(".plus").onclick=()=>{
            if(progress[team]<4){
                progress[team]++;
                if(progress[team] === 4) playStepSound('win');
                else playStepSound('plus');
                render();
            }
        };

        card.querySelector(".minus").onclick=()=>{
            if(progress[team]>0){
                progress[team]--;
                playStepSound('minus');
                render();
            }
        };
        controlsDiv.appendChild(card);
    });
}

document.addEventListener("keydown",(e)=>{
    const key = e.key.toUpperCase();
    const team = key + "组";
    if(!order.includes(team)) return;

    if(e.shiftKey){
        if(progress[team]>0){
            progress[team]--;
            playStepSound('minus');
        }
    }else{
        if(progress[team]<4){
            progress[team]++;
            if(progress[team] === 4) playStepSound('win');
            else playStepSound('plus');
        }
    }
    render();
});

render();
</script>

</body>
</html>
